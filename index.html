<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CinemaWheels TWA</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="app.js"></script>
</head>
<body>
  <div id="loader">Загрузка...</div>

  <!-- Экран авторизации -->
  <section id="auth-screen" class="screen hidden">
    <form id="auth-form">
      <label for="auth-name">Имя:</label>
      <input type="text" id="auth-name" required />
      <button type="submit" id="auth-submit">Войти</button>
    </form>
  </section>

  <!-- Основной экран -->
  <section id="main-screen" class="screen hidden">
    <header>
      <div id="profile-button">Профиль</div>
    </header>
    <form id="report-form">
      <input type="text" id="project" list="recent-projects" placeholder="Проект" />
      <datalist id="recent-projects"></datalist>

      <label>Начало смены:</label>
      <input type="time" id="shift-start" required />

      <label>Конец смены:</label>
      <input type="time" id="shift-end" required />

      <label>Начало прицепа:</label>
      <input type="time" id="trailer-start" />

      <label>Конец прицепа:</label>
      <input type="time" id="trailer-end" />

      <button type="submit">Отправить</button>
    </form>
  </section>

  <!-- Профиль -->
  <section id="profile-screen" class="screen hidden">
    <p>ID пользователя: <span id="profile-id"></span></p>
    <button id="profile-edit-name">Изменить имя</button>
    <button id="profile-edit-reports">Мои отчёты</button>
    <button id="profile-close">Закрыть</button>
  </section>

  <!-- Экран редактирования отчётов -->
  <section id="edit-list-screen" class="screen hidden">
    <h2>Мои отчёты</h2>
    <ul id="report-list"></ul>
    <button id="edit-list-close-button">Закрыть</button>
  </section>
</body>
</html>
