<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Отчеты о смене</title>
    <!-- (2.0) Подключаем Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- (2.0) Подключаем стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- (2.0) (5.0) Загрузчик -->
    <div id="loader" class="screen">
        <div class="spinner"></div>
    </div>

    <!-- (5.1) Экран аутентификации -->
    <div id="auth-screen" class="screen hidden">
        <div class="auth-container">
            <svg class="auth-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <h1 class="auth-title">Добро пожаловать</h1>
            <p class="auth-subtitle">Для начала работы, пожалуйста, введите ваше ФИО. Оно будет использоваться во всех отчетах.</p>
            
            <form id="auth-form">
                <div class="input-group">
                    <label for="auth-name">Ваше ФИО</label>
                    <input type="text" id="auth-name" name="auth-name" required minlength="5" placeholder="Иванов Иван Иванович">
                </div>
                <div id="auth-error" class="auth-error hidden"></div>
                <button type="submit" id="auth-submit" class="auth-button">Сохранить и войти</button>
            </form>
        </div>
    </div>

    <!-- (5.2) Экран профиля -->
    <div id="profile-screen" class="screen hidden">
        <div class="profile-header">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0021.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 003.065 7.097A9.716 9.716 0 0012 21.75a9.716 9.716 0 006.685-2.653zm-12.54-1.285A7.486 7.486 0 0112 15.75a7.486 7.486 0 015.855 2.062A8.98 8.98 0 0112 20.25a8.98 8.98 0 01-5.855-2.438zM15.75 9a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" clip-rule="evenodd" />
            </svg>
            <h2 id="profile-name">Загрузка...</h2>
            <p id="profile-id">ID: ...</p>
            <button id="profile-close-button" class="close-button">&times;</button>
        </div>
        <div class="profile-menu">
            <button id="profile-edit-name" class="menu-item">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" />
                </svg>
                <span>Сменить ФИО</span>
            </button>
            <button id="profile-edit-reports" class="menu-item">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12M8.25 17.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                </svg>
                <span>Редактировать отчеты</span>
            </button>
        </div>
    </div>

    <!-- (5.4) Экран списка отчетов -->
    <div id="edit-list-screen" class="screen hidden">
        <div class="screen-header">
            <h1 class="screen-title">Последние 10 отчетов</h1>
            <button id="edit-list-close-button" class="close-button">&times;</button>
        </div>
        <div id="edit-list-container" class="report-list-container">
            <!-- (5.4) Сюда JS вставит список -->
        </div>
    </div>

    <!-- (5.3) Главный экран (Форма) -->
    <div id="main-screen" class="screen hidden">
        <div class="screen-header">
            <h1 id="header-title" class="screen-title">Отчёт о смене</h1>
            <button id="profile-button" class="profile-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0021.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 003.065 7.097A9.716 9.716 0 0012 21.75a9.716 9.716 0 006.685-2.653zm-12.54-1.285A7.486 7.486 0 0112 15.75a7.486 7.486 0 015.855 2.062A8.98 8.98 0 0112 20.25a8.98 8.98 0 01-5.855-2.438zM15.75 9a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>

        <form id="report-form" class="form-container">
            <!-- (5.3) Дата -->
            <div class="input-group">
                <label for="date">Дата</label>
                <input type="date" id="date" name="date" required>
            </div>
            
            <!-- (5.3) Проект -->
            <div class="input-group">
                <label for="project">Проект</label>
                <input type="text" id="project" name="project" list="recent-projects" placeholder="Название проекта" required>
                <datalist id="recent-projects"></datalist>
            </div>
            
            <!-- (5.3) Техника -->
            <div class="input-group">
                <label for="vehicle">Техника</label>
                <select id="vehicle" name="vehicle" required>
                    <option value="">— выберите технику —</option>
                    <!-- (5.3) Заполнится из D1 -->
                </select>
            </div>
            
            <!-- (5.3) Место / Адрес -->
            <div class="input-group">
                <label for="address">Место / Адрес</label>
                <textarea id="address" name="address" rows="2" placeholder="Где вы работали" required></textarea>
            </div>
            
            <!-- (5.3) Смена -->
            <div class="input-group">
                <label>Смена (Начало / Конец)</label>
                <div class="time-inputs">
                    <input type="time" id="shift-start" name="shift-start" required>
                    <input type="time" id="shift-end" name="shift-end" required>
                </div>
            </div>
            
            <!-- (5.3) Прицеп -->
            <div class="input-group">
                <label for="trailer">Прицеп (опционально)</label>
                <select id="trailer" name="trailer">
                    <option value="">— выберите прицеп —</option>
                    <!-- (5.3) Заполнится из D1 -->
                </select>
            </div>
            
            <!-- (5.3) Логика времени прицепа -->
            <div id="trailer-time-logic" class="trailer-logic">
                <label for="trailer-time-toggle" class="toggle-label hidden" id="trailer-time-toggle-label">
                    <input type="checkbox" id="trailer-time-toggle" name="trailer_diff_time">
                    <span>Время прицепа отличается от времени смены</span>
                </label>
                
                <div id="trailer-time-fields" class="time-inputs hidden">
                    <input type="time" id="trailer-start" name="trailer-start">
                    <input type="time" id="trailer-end" name="trailer-end">
                </div>
            </div>
            
            <!-- (5.3) Перепробег -->
            <div class="input-group">
                <label for="overrun">Перепробег (км)</label>
                <input type="number" id="overrun" name="overrun" min="0" placeholder="0">
            </div>
            
            <!-- (5.3) Комментарий -->
            <div class="input-group">
                <label for="comment">Комментарий</label>
                <textarea id="comment" name="comment" rows="3" placeholder="Любые детали, проблемы, заметки..."></textarea>
            </div>

        </form>
    </div>
    
    <!-- (2.0) Подключаем логику -->
    <script src="app.js" defer></script>
</body>
</html>
